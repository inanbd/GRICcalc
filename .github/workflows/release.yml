name: Release

# Publishes a GitHub Release with the Android APKs attached. Push a tag
# (git tag v1.0.0 && git push origin v1.0.0), or run it by hand from the
# Actions tab against an existing tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'
  # Set these repository secrets to sign properly; without them the APKs are
  # signed with Android's debug key (installable, but not distributable).
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Flutter
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -o flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar -xf flutter.tar.xz -C "$RUNNER_TOOL_CACHE"
          echo "$RUNNER_TOOL_CACHE/flutter/bin" >> "$GITHUB_PATH"

      - name: Check out the toolchain
        run: |
          flutter --version
          flutter pub get

      # A release should not ship code that does not pass what CI would check.
      - name: Verify
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Stage artifacts
        id: stage
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.name }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/griccalc-${version}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "dist/griccalc-${version}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      "dist/griccalc-${version}-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk             "dist/griccalc-${version}-universal.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Record how the APKs were signed
        id: signing
        run: |
          set -euo pipefail
          apk="dist/griccalc-${{ steps.tag.outputs.name }}-arm64-v8a.apk"
          signer="$(find "${ANDROID_HOME:?ANDROID_HOME is not set}/build-tools" \
            -name apksigner -type f | sort | tail -1)"
          if [ -z "$signer" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools" >&2
            exit 1
          fi
          echo "Using $signer"
          # Deliberately no "|| true": if the certificate cannot be read, fail
          # rather than fall through, because the fallthrough would overstate
          # how the release was signed.
          "$signer" verify --print-certs "$apk" > certs.txt
          cat certs.txt
          # build-tools <=36 prints "Signer #1 certificate DN:", 37+ prints
          # "V2 Signer: certificate DN:", so match on the common part.
          dn="$(grep -m1 'certificate DN' certs.txt)"
          if echo "$dn" | grep -q 'CN=Android Debug'; then
            note="These APKs are signed with Android's **debug** key, because no signing secrets are configured. They install for sideloading, but the signature proves nothing about who built them, and a later properly signed build will not install over them. See README.md > Signing releases."
          else
            note="These APKs are signed with the project's release key."
          fi
          echo "note=$note" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.name }}"
          cat > notes.md <<NOTES
          NICU GIR Calculator ${version} - glucose infusion rate and fluid totals for neonates.

          Enter the baby's weight in grams, add a line per fluid, and the app totals
          the GIR (mg/kg/min), the rate (mL/hr) and the daily fluid (mL/kg/day).

          ## Install

          Most phones and tablets need **arm64-v8a**. Older 32-bit devices need
          **armeabi-v7a**; emulators generally need **x86_64**. The **universal**
          APK carries every ABI and works anywhere, at roughly triple the size.

          Verify a download against \`SHA256SUMS.txt\` with \`sha256sum -c\`.

          ## Signing

          ${{ steps.signing.outputs.note }}

          ## Disclaimer

          For use by clinicians as a calculation aid only. Check every figure
          against your unit's protocol and an independent calculation before
          acting on it.
          NOTES

          if gh release view "$version" >/dev/null 2>&1; then
            gh release edit "$version" \
              --title "NICU GIR Calculator $version" \
              --notes-file notes.md
            gh release upload "$version" dist/* --clobber
          else
            gh release create "$version" dist/* \
              --target "$GITHUB_SHA" \
              --title "NICU GIR Calculator $version" \
              --notes-file notes.md
          fi
